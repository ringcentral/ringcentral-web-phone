name: Publish npm package

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ringcentral-web-phone
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify version
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./package.json').version")"
      - run: pnpm install --frozen-lockfile
      - run: npm publish
